version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autoscale_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoscale
    ports:
      - "5444:5432"
    volumes:
      - autoscale_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoscale"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoscale_backend
    environment:
      PORT: 4004
      DATABASE_URL: postgres://postgres:postgres@db:5432/autoscale
      JWT_SECRET: supersecret_autoscale_jwt_key_2026
      CORS_ORIGIN: http://localhost:3004
    ports:
      - "4004:4004"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4004
    container_name: autoscale_frontend
    ports:
      - "3004:3004"
    depends_on:
      - backend

volumes:
  autoscale_pgdata:
